version: "3.9"

services:
  beta-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beta-app
    restart: unless-stopped
    ports:
      - "3020:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.beta-app.rule=Host(`tudominio.com`)"
      - "traefik.http.routers.beta-app.entrypoints=websecure"
      - "traefik.http.routers.beta-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.beta-app.loadbalancer.server.port=80"
